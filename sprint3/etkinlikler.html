<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etkinlikler · Kampüs Etkinlikleri</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/2321032021.css">
  <script type="module" src="js/event-list.js"></script>
</head>
<body>
  <header>
    <h1>Kampüs Etkinlikleri</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html" aria-current="page">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <div class="bolum">
      <h2 id="liste-baslik">Tüm Etkinlikler</h2>

      <form id="filtre-formu" class="filtre" role="search">
        <p>
          <label for="arama">Etkinlik ara</label>
          <input type="search" id="arama" name="arama" placeholder="Örn. atölye, kariyer">
        </p>
        <p>
          <label for="kategori-filtre">Kategori</label>
          <!-- Diğer kategoriler event-list.js ile veriden eklenir -->
          <select id="kategori-filtre" name="kategori">
            <option value="">Tümü</option>
          </select>
        </p>
      </form>

      <p id="sonuc" class="sonuc" aria-live="polite"></p>

      <!-- Kartları event-list.js data.js'ten üretir -->
      <section id="etkinlik-listesi" class="kartlar kartlar-3" aria-labelledby="liste-baslik"></section>
    </div>
  </main>

  <footer>
    <p>Mustafa Yiğit Emet · 2321032021 · 2026</p>
  </footer>
</body>
</html>
