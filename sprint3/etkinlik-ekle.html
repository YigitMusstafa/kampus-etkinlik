<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etkinlik Ekle · Kampüs Etkinlikleri</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/2321032021.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>
  <header>
    <h1>Etkinlik Ekle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
    </nav>
  </header>

  <main>
    <!-- novalidate: tarayıcı balonları kapalı, kontrolü event-form.js yapar -->
    <form id="etkinlik-formu" novalidate>
      <p class="form-not">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

      <p>
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad" required aria-describedby="ad-hata">
        <span id="ad-hata" class="hata"></span>
      </p>

      <p>
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori" required aria-describedby="kategori-hata">
          <option value="">Seçiniz</option>
          <option value="Atölye">Atölye</option>
          <option value="Panel">Panel</option>
          <option value="Seminer">Seminer</option>
          <option value="Webinar">Webinar</option>
        </select>
        <span id="kategori-hata" class="hata"></span>
      </p>

      <p>
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih" required aria-describedby="tarih-hata">
        <span id="tarih-hata" class="hata"></span>
      </p>

      <p>
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat" required aria-describedby="saat-hata">
        <span id="saat-hata" class="hata"></span>
      </p>

      <p>
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer" placeholder="Örn. Mühendislik Fakültesi Konferans Salonu" required aria-describedby="yer-hata">
        <span id="yer-hata" class="hata"></span>
      </p>

      <p>
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" step="1" inputmode="numeric" aria-describedby="kontenjan-hata">
        <span id="kontenjan-hata" class="hata"></span>
      </p>

      <p>
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4"></textarea>
      </p>

      <button type="submit">Kaydet</button>
    </form>

    <div id="form-mesaj" class="form-mesaj" aria-live="polite"></div>
  </main>

  <footer>
    <p>Mustafa Yiğit Emet · 2321032021 · 2026</p>
  </footer>
</body>
</html>
