<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etkinlik Güncelle · Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2321032021.css">
</head>
<body>
  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html" aria-current="page">Güncelle</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <p>
        <label for="ad">Etkinlik Adı</label>
        <input type="text" id="ad" name="ad" value="AI’s Path Forward: From Intelligence to Super-intelligence" required>
      </p>

      <p>
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required>
          <option value="">Seçiniz</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="webinar" selected>Webinar</option>
          <option value="panel">Panel</option>
        </select>
      </p>

      <p>
        <label for="tarih">Tarih</label>
        <input type="date" id="tarih" name="tarih" value="2026-02-13" required>
      </p>

      <p>
        <label for="saat">Saat</label>
        <input type="time" id="saat" name="saat" value="11:30" required>
      </p>

      <p>
        <label for="yer">Yer</label>
        <input type="text" id="yer" name="yer" value="Çevrimiçi (Zoom)" required>
      </p>

      <p>
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4" required>AIARC'ın "Minds of AI" webinar serisinin 2. oturumunda Dr. Deepak Painuli, yapay zekânın zekâdan süper zekâya uzanan yolunu ele alacak.</textarea>
      </p>

      <button type="submit">Güncelle</button>
    </form>

    <p><a class="geri" href="etkinlik-detay.html">Etkinlik detayına dön</a></p>
  </main>

  <footer>
    <p>Mustafa Yiğit Emet · 2321032021 · 2026</p>
  </footer>
</body>
</html>
