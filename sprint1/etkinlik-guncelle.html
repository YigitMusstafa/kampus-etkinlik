<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Etkinlik Güncelle · Kampüs Etkinlikleri</title>
</head>
<body>
  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-detay.html">Detay</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <p>
        <label for="ad">Etkinlik Adı</label><br>
        <input type="text" id="ad" name="ad" value="Emre Akbaş ile Derin Öğrenmede Güncel Yönelimler" required>
      </p>

      <p>
        <label for="kategori">Kategori</label><br>
        <select id="kategori" name="kategori">
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="webinar" selected>Webinar</option>
          <option value="panel">Panel</option>
        </select>
      </p>

      <p>
        <label for="tarih-saat">Tarih / Saat</label><br>
        <input type="datetime-local" id="tarih-saat" name="tarih-saat" value="2026-10-02T15:00" required>
      </p>

      <p>
        <label for="yer">Yer</label><br>
        <input type="text" id="yer" name="yer" value="Çevrimiçi (Zoom)" required>
      </p>

      <p>
        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" rows="4">AIARC'ın "Minds of AI" webinar serisinin bu oturumunda Emre Akbaş, derin öğrenme alanındaki güncel araştırma yönelimlerini ele alacak.</textarea>
      </p>

      <button type="submit">Güncelle</button>
    </form>

    <p><a href="etkinlik-detay.html">Etkinlik detayına dön</a></p>
  </main>

  <footer>
    <p>Mustafa Yiğit Emet · 2321032021 · 2026</p>
  </footer>
</body>
</html>
